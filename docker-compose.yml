services:
  # ---------- DATABASE FOR AIRFLOW ----------
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  # ---------- SETS UP AIRFLOW ----------
  airflow-init:
    build:
      context: .
      dockerfile: DockerFile
    user: airflow
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      S3_RAW_BUCKET: ${S3_RAW_BUCKET}
    volumes:
      - /workspaces/modern-lakehouse-batch:/opt/airflow/project_root
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com

  # ---------- AIRFLOW WEB UI ----------
  airflow-webserver:
    build:
      context: .
      dockerfile: DockerFile
    user: airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/project_root/airflow/dags"
      PYTHONPATH: "/opt/airflow/project_root"
      S3_RAW_BUCKET: ${S3_RAW_BUCKET}
      
    volumes:
      - /workspaces/modern-lakehouse-batch:/opt/airflow/project_root
    command: webserver
    ports:
      - "8080:8080"
    restart: always

  # ---------- AIRFLOW SCHEDULER ----------
  airflow-scheduler:
    build:
      context: .
      dockerfile: DockerFile
    user: airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/project_root/airflow/dags"
      PYTHONPATH: "/opt/airflow/project_root"
      FMP_API_KEY: ${FMP_API_KEY}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      S3_RAW_BUCKET: ${S3_RAW_BUCKET}

    volumes:
      - /workspaces/modern-lakehouse-batch:/opt/airflow/project_root
    command: scheduler
    restart: always
volumes:
  postgres-db-volume: